[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mjlabai"
version = "0.0.0"
description = "MjLabAI Tenhou Mahjong AI research scaffolding"
requires-python = ">=3.9"
dependencies = [
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "mahjax==0.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]
